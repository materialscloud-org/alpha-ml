version: '2'

services:
  redis:
    image: 'redis:3.0-alpine'
    command: redis-server --requirepass devpassword --port 3247
    volumes:
      - 'redis:/var/lib/redis/data'
    ports:
      - '3247:3247'

  website:
    build: .
    command: ["/sbin/my_init"]
    environment:
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      REDIS_PORT : '3247'
      PYTHONUNBUFFERED: 'true'

    volumes:
      - '/Users/iMac/PycharmProjects/nmr_test/data:/home/app/data'
    ports:
      - '3246:80'

  celery:
    build: .
    command: >
        bash -c "cd /home/app/code/webservice &&
                    /home/app/.local/bin/celery worker -l info -A seekpath_app.celery"
    env_file:
      - '.env'
    environment:
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      REDIS_PORT : '3247'
    ports:
      - '3248:80'
    volumes:
      - '/Users/iMac/PycharmProjects/nmr_test/data:/home/app/data'

volumes:
  redis: