version: '2'

services:
  redis:
    image: 'redis:3.0-alpine'
    command: redis-server --requirepass devpassword
    volumes:
      - 'redis:/var/lib/redis/data'
    ports:
      - '6379:6379'

  website:
    build: .
    command: ["/sbin/my_init"]
    environment:
      PYTHONUNBUFFERED: 'true'
    volumes:
      - '/Users/iMac/PycharmProjects/data:/home/app/data'
    ports:
      - '5050:80'

  celery:
    build: .
    command: >
        bash -c "cd /home/app/code/webservice &&
                    /home/app/.local/bin/celery worker -l info -A seekpath_app.celery"
    env_file:
      - '.env'
    volumes:
      - '/Users/iMac/PycharmProjects/data:/home/app/data'

volumes:
  redis: