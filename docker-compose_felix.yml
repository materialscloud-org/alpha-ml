version: '2'

services:
  redis:
    image: 'redis:4.0.8-alpine'
    command: redis-server --requirepass devpassword --port 6676
    volumes:
      - 'redis:/var/lib/redis/data'


  website:
    build: .
    command: ["/sbin/my_init"]
    environment:
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      PYTHONUNBUFFERED: 'true'
      REDIS_PORT : '6676'

    volumes:
      - '/local/git/nmr_test/data:/home/app/data'
    ports:
      - '5050:80'

  celery:
    build: .
    command: >
        bash -c "cd /home/app/code/webservice &&
                    /home/app/.local/bin/celery worker -l info -A seekpath_app.celery"
    env_file:
      - '.env'
    environment:
      C_FORCE_ROOT : 'true'
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      REDIS_PORT : '6676'
    volumes:
      - '/local/git/nmr_test/data:/home/app/data'

volumes:
  redis:
