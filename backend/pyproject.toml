[project]
name = "alphaml-api"
version = "2.0.0.dev0"
description = "alpha-ml backend: machine-learned molecular polarizabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scipy>=1.13",
  "ase>=3.23",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaml_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
