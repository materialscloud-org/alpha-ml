# docker-compose for Materials Cloud Tools
version: '2'

services:
  redis:
    hostname: redis
    image: 'redis:3.0-alpine'
    command: redis-server --requirepass devpassword --port 3247
    volumes:
      - 'redis:/var/lib/redis/data'

  website:
    hostname: website
    build: .
    command: ["/sbin/my_init"]
    environment:
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      REDIS_PORT : '3247'
      PYTHONUNBUFFERED: 'true'

    volumes:
      - 'nmr_data_dir'
    ports:
      - '3246:80'

  celery:
    hostname: celery
    build: .
    command: >
        bash -c "cd /home/app/code/webservice &&
                    /home/app/.local/bin/celery worker -l info -A seekpath_app.celery"
    env_file:
      - '.env'
    environment:
      DEBUG : 'false'
      FAST_DEV : 'false'
      MSK : 'true'
      REDIS_PORT : '3247'
    volumes:
      - 'nmr_data_dir'

volumes:
  redis:
