<!DOCTYPE html>
<html>
<title>A simple Jsmol example</title>
<head>

<script type="text/javascript" src="./jsmol/JSmol.min.js"></script>


<script type="text/javascript">
var Info = {
  width: 300,
  height: 300,
  use: "HTML5",
  color: "0xFFFFFF",
  j2sPath: "./jsmol/j2s",
  jarPath: "./jmol/java",
  jarFile: "JmolAppletSigned.jar",
  console: "jmolApplet0_infodiv"
}
</script>
</head>

<body>
<script type="text/javascript">
  jmolApplet0 = Jmol.getApplet("jmolApplet0", Info);
  Jmol.script(jmolApplet0,"background white;load  Magres::test.magres")
</script>
<br>
<a href="javascript:Jmol.script(jmolApplet0,'spin on')">spin</a>
<a href="javascript:Jmol.script(jmolApplet0,'spin off')">off</a>
</body>
